<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0A1F"/>
      <stop offset="0.5" stop-color="#110E2B"/>
      <stop offset="1" stop-color="#1A1240"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B3A9E"/>
      <stop offset="0.5" stop-color="#4C2F9E"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#312E81"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#6366F1" opacity="0.45"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6366F1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>

  <!-- corner blobs -->
  <circle cx="100" cy="-10" r="130" fill="url(#orb)" opacity="0.55"/>
  <circle cx="1620" cy="70" r="120" fill="url(#orb)" opacity="0.55"/>

  <!-- dot grids -->
  <rect x="1175" y="58" width="150" height="120" fill="url(#dots)"/>
  <rect x="310" y="288" width="95" height="75" fill="url(#dots)"/>
  <rect x="62" y="214" width="60" height="80" fill="url(#dots)"/>

  <!-- connector lines -->
  <g fill="none" stroke="#6366F1" stroke-width="1.6" opacity="0.6">
    <path d="M130 167 Q30 210 60 282 Q80 330 140 335 Q200 340 230 330"/>
    <path d="M210 395 Q300 410 330 480 Q345 520 350 545"/>
    <path d="M1400 300 Q1330 320 1333 350 Q1335 410 1430 450"/>
    <path d="M0 140 Q200 60 390 0"/>
    <path d="M1600 190 Q1450 120 1370 0"/>
  </g>
  <g fill="#818CF8">
    <circle cx="130" cy="167" r="6"/><circle cx="60" cy="282" r="6"/><circle cx="98" cy="332" r="6"/><circle cx="1333" cy="350" r="6"/>
  </g>

  <!-- floating spheres -->
  <circle cx="1407" cy="161" r="21" fill="url(#orb)" opacity="0.5"/>
  <circle cx="255" cy="513" r="16" fill="url(#orb)" opacity="0.45"/>
  <circle cx="1249" cy="526" r="16" fill="url(#orb)" opacity="0.45"/>

  <!-- waves -->
  <path d="M0 470 Q250 560 520 610 Q800 660 1100 600 Q1400 540 1600 600 V800 H0 Z" fill="url(#wave)" opacity="0.25"/>
  <path d="M0 600 Q300 560 620 640 Q900 700 1200 630 Q1420 580 1600 650 V800 H0 Z" fill="url(#wave)" opacity="0.35"/>
  <path d="M0 690 Q350 620 700 700 Q1000 760 1300 680 Q1480 640 1600 700 V800 H0 Z" fill="url(#wave)" opacity="0.45"/>
  <path d="M0 600 Q300 560 620 640 Q900 700 1200 630 Q1420 580 1600 650" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
  <circle cx="140" cy="615" r="68" fill="url(#orb)" opacity="0.6"/>
  <circle cx="1407" cy="655" r="38" fill="url(#orb)" opacity="0.6"/>

  <!-- icon tiles -->
  <g filter="url(#shadow)">
    <rect x="125" y="180" width="125" height="125" rx="20" fill="#1E1B4B" opacity="0.85" transform="rotate(-12 187 242)"/>
    <rect x="100" y="372" width="115" height="115" rx="20" fill="#1E1B4B" opacity="0.8" transform="rotate(-12 157 430)"/>
    <rect x="1398" y="252" width="118" height="118" rx="20" fill="#1E1B4B" opacity="0.85" transform="rotate(12 1457 311)"/>
    <rect x="1412" y="428" width="120" height="120" rx="20" fill="#1E1B4B" opacity="0.8" transform="rotate(14 1472 488)"/>
  </g>
  <g fill="#A78BFA">
    <!-- document -->
    <g transform="rotate(-12 187 242)">
      <path d="M165 212 H198 L212 226 V272 H165 Z"/>
      <g fill="#1E1B4B"><rect x="172" y="232" width="16" height="4" rx="2"/><rect x="172" y="244" width="30" height="4" rx="2"/><rect x="172" y="256" width="24" height="4" rx="2"/></g>
    </g>
    <!-- chart -->
    <g transform="rotate(-12 157 430)">
      <rect x="135" y="432" width="11" height="20" rx="3"/><rect x="151" y="420" width="11" height="32" rx="3"/><rect x="167" y="405" width="11" height="47" rx="3"/>
    </g>
    <!-- briefcase -->
    <g transform="rotate(12 1457 311)">
      <rect x="1446" y="286" width="22" height="10" rx="3" fill="none" stroke="#A78BFA" stroke-width="4"/>
      <rect x="1430" y="294" width="54" height="36" rx="6"/>
      <rect x="1452" y="306" width="10" height="8" rx="2" fill="#1E1B4B"/>
    </g>
    <!-- graduation cap -->
    <g transform="rotate(14 1472 488)">
      <path d="M1442 482 L1474 468 L1506 482 L1474 496 Z"/>
      <path d="M1456 489 V503 Q1474 514 1492 503 V489 L1474 497 Z"/>
      <rect x="1446" y="484" width="3" height="20" rx="1.5"/>
    </g>
  </g>
</svg>

